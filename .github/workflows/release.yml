name: Release image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate release and private files
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test -z "$(git ls-files dev)"
          test -z "$(git ls-files '*.png' '*.jpg' '*.jpeg' '*.mp4' '.env*')"
      - name: Build
        run: docker build -f docker/Dockerfile -t ascii-qr-studio:release .
      - name: Test release image
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m ascii-qr-studio:release python -m unittest -v
      - name: Publish tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag ascii-qr-studio:release "$IMAGE:${GITHUB_REF_NAME#v}"
          docker tag ascii-qr-studio:release "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:${GITHUB_REF_NAME#v}"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker logout ghcr.io
